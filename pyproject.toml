[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-rt"
version = "0.2.0"
description = "Ground-truth MCP server security engine — VAPT probes, benchmark, and compliance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ved Pandya" }]
keywords = ["mcp", "security", "vulnerability-scanner", "vapt", "ai-agents", "llm-security", "owasp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp",
  "rich",
  "anthropic",
  "google-genai",
  "pyyaml",      # deserialization fixtures/probe + real yaml-config servers
  "markdown",    # HTML/PDF report deliverable (hunt.report.render_html)
  "cryptography", # Ed25519 signing/verify for ground-truth attestations (mcp_rt.attest)
]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn", "sqlalchemy", "authlib", "itsdangerous"]   # multi-tenant scan service + dashboard + SSO (mcp-rt serve)
postgres = ["psycopg"]       # Postgres driver for the VPS/SaaS deployment (DATABASE_URL)
capture = ["mitmproxy"]      # TLS egress interception for remote/http targets
pdf = ["weasyprint"]         # branded PDF deliverable (hunt.report.to_pdf); needs system libs (pango/cairo)

[project.urls]
Homepage = "https://github.com/MartOcd1709/mcp-rt"
Repository = "https://github.com/MartOcd1709/mcp-rt"
Issues = "https://github.com/MartOcd1709/mcp-rt/issues"

[project.scripts]
mcp-rt = "hunt.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mcp_rt*", "hunt*"]

[tool.pytest.ini_options]
# deepeval's pytest11 plugin eager-imports eventlet, which monkey-patches and then
# crashes on py3.13+trio (GreenSocket.sendmsg) at collection. We don't use it — disable it.
addopts = "-p no:deepeval"
testpaths = ["tests"]

